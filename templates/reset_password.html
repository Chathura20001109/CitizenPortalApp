<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Citizen Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e40af;
            --secondary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f0f4ff;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 40%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 440px;
        }
        h1 { margin-bottom: 0.5rem; font-size: 1.5rem; color: #1e293b; }
        p { color: #64748b; margin-bottom: 2rem; font-size: 0.9rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.875rem; }
        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: var(--secondary); }
        .btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { background: #1d4ed8; transform: translateY(-1px); }
        .alert {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: none;
            font-size: 0.875rem;
        }
        .alert-error { background: #fef2f2; color: #ef4444; border: 1px solid #fee2e2; }
        .alert-success { background: #f0fdf4; color: #10b981; border: 1px solid #dcfce7; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Set New Password</h1>
        <p>Please enter your new secure password below.</p>
        
        <div class="alert alert-error" id="error"></div>
        <div class="alert alert-success" id="success"></div>
        
        <div id="reset-form">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" placeholder="Minimum 8 characters">
            </div>
            <div class="form-group">
                <label for="confirm">Confirm New Password</label>
                <input type="password" id="confirm" placeholder="Re-enter password">
            </div>
            <button class="btn" onclick="submitReset()">Update Password</button>
        </div>
        
        <div id="success-link" style="display:none; text-align:center; margin-top:1rem;">
            <a href="/citizen/login" style="color:var(--primary); font-weight:600; text-decoration:none;">Go to Login</a>
        </div>
    </div>

    <script>
        const token = "{{ token }}";
        
        function showAlert(id, msg) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.style.display = 'block';
        }

        async function submitReset() {
            document.getElementById('error').style.display = 'none';
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            
            if (password.length < 8) { showAlert('error', 'Password must be at least 8 characters.'); return; }
            if (password !== confirm) { showAlert('error', 'Passwords do not match.'); return; }
            
            try {
                const res = await fetch('/api/citizen/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                const data = await res.json();
                if (res.ok) {
                    showAlert('success', 'Password updated successfully!');
                    document.getElementById('reset-form').style.display = 'none';
                    document.getElementById('success-link').style.display = 'block';
                } else {
                    showAlert('error', data.error || 'Failed to reset password.');
                }
            } catch (e) {
                showAlert('error', 'Connection error.');
            }
        }
    </script>
</body>
</html>
